*{box-sizing:border-box}body{margin:0;padding:30px 0;background:transparent;display:grid;justify-content:center;font-family:VT323,monospace;--accent:#ffbd28}.profile{width:270px;border:10px solid #111;outline:1px solid #ffbd28;background:#000;color:var(--accent)}.scene{height:450px;position:relative;overflow:hidden;background:#080808}.portrait{position:absolute;width:100%;height:100%;object-fit:contain;object-position:center center}.placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-size:18px}.shade{position:absolute;inset:auto 0 0;height:210px;background:rgba(0,0,0,.92);clip-path:polygon(0 15%,100% 0,100% 100%,0 100%);transform:translateY(160px);transition:transform .6s}.top{position:absolute;inset:0 0 auto;background:var(--accent);color:#111;padding:15px;text-align:center;transform:translateY(-110%);transition:transform .6s}.details{position:absolute;bottom:0;width:100%;height:155px;padding:13px;transform:translateY(110%);transition:transform .6s;color:#eee;font-size:17px}.details div{border-bottom:1px solid #80500b;padding:5px 0;display:flex;justify-content:space-between;gap:8px}.details b{color:var(--accent);font-weight:normal}.scene:hover .shade,.scene:focus-within .shade,.scene.active .shade,.scene:hover .top,.scene.active .top,.scene:hover .details,.scene.active .details{transform:translateY(0)}footer{padding:16px 12px;text-align:center}.nick{font:25px Georgia,serif;color:var(--accent)}.quote{margin:12px 0 0;background:#241300;color:var(--accent);padding:8px;font-size:16px}.hint{font-size:12px;text-align:left;margin-top:10px;letter-spacing:2px}.scene:focus-visible{outline:2px solid var(--accent)}
